# SUPER on the lab stack (Unity sim + FAST_LIO + hiperlab_rostools), perception-aware A* cost ON.
# Derived from click_perception_ros1.yaml; see launch/lab_fsm.launch. Cost-off twin: lab_unity_smooth_ros1.yaml.
# Tune astar/perception/logdet_ref from /fsm_node/visualization/perception_logdet during a normal flight.
fsm:
  click_goal_en: true
  click_goal_topic: "/planning/goal"
  click_height: -10.0          # <= -5 keeps the goal z sent by the lab node
  # Lab interface (standard messages; consumed by hiperlab_rostools quad_super_waypoint_control)
  ref_topic: "/planning/ref_traj"
  state_topic: "/planning/fsm_state"
  world_frame: "camera_init"     # FAST_LIO frame; stamps pos_cmd, ref_traj, path
  goal_reach_dis: 0.3            # real tracking error > 0.1 m would otherwise loop GENERATE_TRAJ
  state_pub_rate: 10.0
  click_yaw_en: true
  replan_rate: 15.0
  cmd_topic: "/planning/pos_cmd"
  mpc_cmd_topic: "/planning_cmd/poly_traj"
  timer_en: true

super_planner:
  backup_traj_en: true
  detailed_log_en: false
  visualization_en: true
  use_fov_cut: false
  print_log: true
  visual_process: false
  frontend_in_known_free: false
  goal_yaw_en: true
  goal_vel_en: false
  corridor_bound_dis: 1.0
  corridor_line_max_length: 1.2
  safe_corridor_line_max_length: 5.0
  iris_iter_num: 2
  obs_skip_num: 2
  replan_forward_dt: 0.1
  planning_horizon: 7.0
  sensing_horizon: -1
  receding_dis: 0.0
  robot_r: 0.3                      # lab vehicle radius plus margin
  yaw_dot_max: 1.5                  # <= lab planner/yaw_rate_rad_s
  # Plan the heading of body -X (lab rear-facing sensor); equals lab waypoint_control/heading_offset_rad.
  yaw_offset_rad: 3.141592653589793
  # Yaw mode: 1 heading to velocity, 2 heading to goal
  yaw_mode: 1
  mpc_horizon: 15


traj_opt:
  switch:
    save_log_en: false
    print_optimizer_log: false

  boundary:
    max_vel: 1.5                # first flights; equals the lab trajectory/max_speed
    max_acc: 2.0
    max_jerk: 30.0
    max_omg: 2.5
    max_acc_thr: 20.0
    min_acc_thr: 6.0
    penna_margin: 0.05

  exp_traj:
    # 1 for xi 2 for pos
    pos_constraint_type: 1
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    scale_factor: 1.0
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: -5.0e+5
    penna_attract: 1.0e+3
    penna_omg:  5.0e+5
    penna_thr: 1.0e+5

  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 1
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: true
    opt_accuracy: 1.0e-6
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 1200.0
    penna_ts: 1.0e+5
    penna_pos: 1.0e+6
    penna_vel: 1.0e+5
    penna_acc: 1.0e+5
    penna_jerk: -1.0e+5
    penna_omg: 1.0e+5
    penna_thr: 1.0e+5

  flatness:
    mass: 1.64
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81


astar:
  map_voxel_num: [ 500, 500, 100 ]
  visual_process: false
  allow_diag: true
  # 0 DIAG; 1 MANHATTAN; 2 EUCLIDEAN
  heu_type: 2
  debug_visualization_en: false
  # ---- Perception-aware edge cost (plane normals from LIO) ----------------
  # Edge cost = step * (1 + weight * cell_cost). cell_cost is 0 where the pose
  # Fisher information from the visible planes has log det >= logdet_ref, and
  # grows to cost_max where few or only parallel planes are visible. Planes
  # must be in the same world frame as the odometry fed to rog_map.
  perception:
    enable: true
    plane_topic: "/plane_normals"
    weight: 3.0
    update_rate: 2.0            # Hz, cost grid rebuild
    grid_resolution: 0.5        # m
    half_extent: [10.0, 10.0, 2.0]   # m around the drone; >= planning_horizon + margin
    range: [0.1, 10.0]          # m, Mid-360
    elevation_deg: [-27.0, 32.0] # level world frame; Mid-360 (-7..52) pitched 20 deg down
    max_planes: 200
    sigma_r: 0.02               # m
    sigma_theta_deg: 0.15
    eps_reg: 1.0e-6
    logdet_ref: 80.0            # sim demo value: just under the forest map's normal ~82; tune from visualization/perception_logdet on the real stack
    logdet_scale: 5.0
    cost_max: 3.0
    default_cost: 0.0           # outside the grid / before the first scan


rog_map:
  resolution: 0.1
  inflation_resolution: 0.2
  inflation_step: 2
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [ 50,50,6 ]
  # If the map rolling is disable, the map origin [m] should be set.
  fix_map_origin: [ 0,0,1.5 ]
  frontier_extraction_en: false

  # Virtual ceil and ground
  virtual_ceil_height: 3.0
  virtual_ground_height: -0.3   # camera_init z; origin is the LiDAR start pose ~0.1-0.2 m above ground

  load_pcd_en: false

  map_sliding:
    enable: true
    # The minimum distance [m] to slide the map.
    threshold: 0.3

  esdf:
    enable: false
    resolution: 0.1
    # The range of esdf around the odom [m].
    local_update_box: [ 5,5,3 ]

  # If [enable = true], the ROG-Map will actively take ros topic as input.
  #  else user should call function [updateMap] to update the map.
  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered"
    odom_topic: "/Odometry_imu"            # FAST_LIO; camera_init frame, same as /cloud_registered
    odom_timeout: 2.0


  visualization:
    enable: true
    # when enabled, use rqt_reconfigure to change the visualization parameters.
    use_dynamic_reconfigure: false
    # The rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    time_rate: 2
    # The frame rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    frame_rate: 0
    # visualization range along the odom [m].
    range: [ 15, 15,4 ]
    frame_id: "camera_init"
    pub_unknown_map_en: false

  # Intensity filter for input point cloud. If the point intensity is less than this value,
  # it will be ignored (to avoid noise like dusk).
  intensity_thresh: -10
  # The temporal downsample rate for input point cloud.
  #  e.g. if set to k, the point cloud will be downsampled to 1/k.
  point_filt_num: 1

  # Probabilistc update
  raycasting:
    # if disable, the map will only maintain occupied information, and all other grid
    # will be considered as unknown.
    enable: false
    batch_update_size: 1
    local_update_box: [ 100,100,5 ]
    # The range of raycasting [m].
    ray_range: [0.5, 100 ]

    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    # The threshold of a non-occupied inf map grid to be considered as free. [0.0-1.0]
    # for counter map, if each cell contains N cells in prob map, then only when
    # N_unk > N * unk_thresh cells are unknown, the cell will be considered as unknown.
    # example: 1) if unk_thresh is set 0.0, then once at least one cell in prob map is unknown,
    #             the cell will be considered as unknown.
    #         2) if unk_thresh is set to 1.0, then only all cells in prob map are unknown,
    #             the cell will be considered as unknown.
    # in all, 1.0 is more aggressive while 0.0 is more conservative.
    unk_thresh: 1.0

